---
# ExternalSecret to create the gpro-forgejo-pat secret used by the GitRepository
# sources once pointed at Forgejo. Reuses the Bitwarden item that also backs the
# ruoka_deploy Drupal module's forgejo_dispatch_pat field.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gpro-forgejo-pat
  namespace: gpro
spec:
  refreshInterval: 1h
  target:
    name: gpro-forgejo-pat
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        # Forgejo resolves the user from the token when it is sent as the
        # basic-auth password; the username only has to be non-empty.
        username: token
        password: "{{ .forgejo_dispatch_pat }}"
  data:
    - secretKey: forgejo_dispatch_pat
      sourceRef:
        storeRef:
          name: bitwarden-fields
          kind: ClusterSecretStore
      remoteRef:
        key: f7f2ed36-37d2-438c-86b9-4e0d99c4b763
        property: forgejo_dispatch_pat
