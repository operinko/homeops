---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/fluxcd.controlplane.io/resourceset_v1.json
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: gpro
  namespace: gpro
  annotations:
    fluxcd.controlplane.io/reconcile: "enabled"
    fluxcd.controlplane.io/reconcileEvery: "5m"
    fluxcd.controlplane.io/reconcileTimeout: "10m"
spec:
  inputsFrom:
    - kind: ResourceSetInputProvider
      name: gpro-branches
  resources:
    - apiVersion: source.toolkit.fluxcd.io/v1
      kind: GitRepository
      metadata:
        name: gpro-<< inputs.branch >>
        namespace: gpro
      spec:
        interval: 1m
        url: https://github.com/operinko-labs/gpro
        ref:
          branch: << inputs.branch >>
        secretRef:
          name: gpro-github-pat

    - apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: gpro-<< inputs.branch >>
        namespace: gpro
      spec:
        interval: 10m
        prune: true
        wait: true
        # timeout must stay well under interval. With both at 5m, a health
        # check that ran to timeout consumed the whole interval, so the next
        # reconcile started the instant the previous one gave up — the
        # Kustomization never left Reconciling and never showed a settled
        # failure. retryInterval is explicit for the same reason: it defaults
        # to interval, and the gap after a failure is the point.
        # timeout also has to exceed a real helm upgrade (~2m for production):
        # with wait:true the health check spans the HelmRelease, so a 2m
        # timeout failed every reconcile that overlapped a rollout.
        timeout: 5m
        retryInterval: 5m
        force: true
        decryption:
          provider: sops
        sourceRef:
          kind: GitRepository
          name: gpro-<< inputs.branch >>
        path: ./deploy/k8s/overlays/<< inputs.branch >>
