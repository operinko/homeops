---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ruoka
resources:
  - ./github-pat-externalsecret.yaml
  - ./ocirepository.yaml
  - ./helmrelease.yaml
  - ./httproute.yaml
configMapGenerator:
  - name: ruoka-nginx
    files:
      - nginx.conf
generatorOptions:
  disableNameSuffixHash: true
