---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ruoka
  namespace: ruoka
  labels:
    route.scope: external
  annotations:
    external-dns.alpha.kubernetes.io/target: external.vaderrp.com
    gatus.home-operations.com/enabled: "true"
    gatus.home-operations.com/endpoint: |
      group: Default
      url: "https://ruoka.vaderrp.com/healthz"
      conditions:
        - "[STATUS] == 200"
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Tools
    gethomepage.dev/name: Ruokalista
    gethomepage.dev/icon: mdi-silverware-fork-knife
    gethomepage.dev/href: https://ruoka.vaderrp.com
    gethomepage.dev/pod-selector: app.kubernetes.io/name=ruoka
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: gateway-public
      namespace: network
  hostnames:
    - ruoka.vaderrp.com
  rules:
    # The CMS moved from Sveltia (served under /admin) to Drupal at
    # ruoka-admin.vaderrp.com — send editors there. 302 rather than 301 so
    # browsers don't cache the hop while the migration settles.
    - matches:
        - path:
            type: PathPrefix
            value: /admin
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            hostname: ruoka-admin.vaderrp.com
            path:
              type: ReplaceFullPath
              replaceFullPath: /
            statusCode: 302
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: traefik-warp
      backendRefs:
        - group: ""
          kind: Service
          name: ruoka
          port: 80
          weight: 1
