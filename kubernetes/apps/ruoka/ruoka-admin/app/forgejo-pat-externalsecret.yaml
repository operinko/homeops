---
# ExternalSecret for ruoka-admin's own Forgejo credential, so its
# InputProvider/GitRepository don't depend on the ruoka app's Kustomization
# having reconciled first. Same Bitwarden field as the ruoka_deploy module.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ruoka-admin-forgejo-pat
  namespace: ruoka
spec:
  refreshInterval: 1h
  target:
    name: ruoka-admin-forgejo-pat
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        # Forgejo resolves the user from the token when it is sent as the
        # basic-auth password; the username only has to be non-empty.
        username: token
        password: "{{ .forgejo_dispatch_pat }}"
  data:
    - secretKey: forgejo_dispatch_pat
      sourceRef:
        storeRef:
          name: bitwarden-fields
          kind: ClusterSecretStore
      remoteRef:
        key: f7f2ed36-37d2-438c-86b9-4e0d99c4b763
        property: forgejo_dispatch_pat
