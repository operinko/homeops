---
# Least-privilege RBAC for the in-cluster forgejo-runner pod: the schemas
# workflow's crd-extractor step runs `kubectl get crd` using this pod's
# ServiceAccount token, and needs nothing else. NOT cluster-admin.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: forgejo-runner-crd-reader
rules:
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: forgejo-runner-crd-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: forgejo-runner-crd-reader
subjects:
  - kind: ServiceAccount
    name: forgejo-runner
    namespace: actions-runner-system
