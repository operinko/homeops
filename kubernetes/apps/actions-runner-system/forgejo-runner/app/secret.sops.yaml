# Offline registration token for the in-cluster forgejo-runner.
# Registration tokens are consumed on first use: once the runner has
# registered (see helmrelease.yaml, which only calls `register` if
# /data/.runner is missing), this value is dead. To re-register (e.g. after
# losing the forgejo-runner-data PVC), generate a fresh token and replace it:
#
#   ssh root@192.168.7.30 "su - git -s /bin/bash -c 'forgejo --config /etc/forgejo/app.ini actions generate-runner-token'"
#
# then `sops kubernetes/apps/actions-runner-system/forgejo-runner/app/secret.sops.yaml`
# to edit the `token` field in place.
