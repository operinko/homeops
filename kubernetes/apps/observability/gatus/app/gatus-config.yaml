---
web:
  port: ${WEB_PORT}
storage:
  type: sqlite
  path: /config/sqlite.db
  caching: false
metrics: true
debug: false
ui:
  title: Status | Gatus
  header: Status
connectivity:
  checker:
    target: 1.1.1.1:53
    interval: 1m
# Alerting configuration
alerting:
  ntfy:
    url: "http://ntfy.observability.svc.cluster.local:8080"
    topic: alerts
    token: ${NTFY_TOKEN}
    priority: 4
    default-alert:
      send-on-resolved: true
      failure-threshold: 3
      success-threshold: 5
  # Custom webhook for n8n alert enrichment
  custom:
    url: "http://n8n-app.tools.svc.cluster.local:5678/webhook/gatus-alerts"
    method: "POST"
    body: |
      {
        "endpoint": {
          "name": "[ENDPOINT_NAME]",
          "group": "[ENDPOINT_GROUP]",
          "url": "[ENDPOINT_URL]"
        },
        "alert": {
          "type": "[ALERT_TYPE]",
          "triggered": [ALERT_TRIGGERED_OR_RESOLVED],
          "description": "[ALERT_DESCRIPTION]"
        },
        "result": {
          "success": [RESULT_SUCCESS],
          "errors": "[RESULT_ERRORS]",
          "hostname": "[RESULT_HOSTNAME]",
          "ip": "[RESULT_IP]",
          "http_status": [RESULT_HTTP_STATUS],
          "duration_ms": [RESULT_DURATION]
        },
        "timestamp": "[TIMESTAMP]"
      }
    headers:
      Content-Type: application/json
    default-alert:
      enabled: true
      send-on-resolved: true
      failure-threshold: 2
      success-threshold: 3
endpoints:
  - name: vaderrp.com domain and expiration
    group: Domains
    url: "https://vaderrp.com"
    interval: 1h
    client:
      dns-resolver: tcp://1.1.1.1:53
    conditions:
      - "[DOMAIN_EXPIRATION] > 720h"
      # NPMplus serves 7-day short-lived LE certs on the apex (max 168h
      # lifetime, renewed around day 4-5) — alert only when renewal is overdue
      - "[CERTIFICATE_EXPIRATION] > 48h"
    alerts:
      - type: ntfy
        send-on-resolved: true
        failure-threshold: 3
        success-threshold: 5
  - name: erinko.fi mail certificate
    group: Domains
    # No DOMAIN_EXPIRATION check for erinko.fi: gatus's whois library cannot
    # parse Traficom's .fi registry output (returns the MinInt64 sentinel)
    url: "https://mail.erinko.fi"
    interval: 1h
    client:
      dns-resolver: tcp://1.1.1.1:53
    conditions:
      - "[CERTIFICATE_EXPIRATION] > 240h"
    alerts:
      - type: ntfy
        send-on-resolved: true
        failure-threshold: 3
        success-threshold: 5
  - name: shadowmorph.info domain and expiration
    group: Domains
    url: "https://shadowmorph.info"
    interval: 1h
    client:
      dns-resolver: tcp://1.1.1.1:53
    conditions:
      - "[DOMAIN_EXPIRATION] > 720h"
      - "[CERTIFICATE_EXPIRATION] > 240h"
    alerts:
      - type: ntfy
        send-on-resolved: true
        failure-threshold: 3
        success-threshold: 5
  # Technitium runs on LXCs outside the cluster and does not issue its own
  # certificate — NPMplus does, and each node pulls the bundle from it. These
  # checks exist to catch that pull breaking. NPMplus issues LE shortlived
  # certs (160h, renewed around day 4-5), so 48h is the same threshold used on
  # the apex above; the 240h used for 90-day certs would alert permanently.
  - name: technitium ns1 DoT certificate
    group: Network
    url: "tls://192.168.7.8:853"
    interval: 1h
    conditions:
      - "[CONNECTED] == true"
      - "[CERTIFICATE_EXPIRATION] > 48h"
    alerts:
      - type: ntfy
        send-on-resolved: true
        failure-threshold: 3
        success-threshold: 5
  - name: technitium ns2 DoT certificate
    group: Network
    url: "tls://192.168.7.9:853"
    interval: 1h
    conditions:
      - "[CONNECTED] == true"
      - "[CERTIFICATE_EXPIRATION] > 48h"
    alerts:
      - type: ntfy
        send-on-resolved: true
        failure-threshold: 3
        success-threshold: 5
