---
# Helm values for kometa app-template deployment
controllers:
  kometa:
    type: cronjob
    cronjob:
      # Daily metadata run at 06:00 local time
      schedule: "0 6 * * *"
      timeZone: Europe/Helsinki
      concurrencyPolicy: Forbid
      successfulJobsHistory: 1
      failedJobsHistory: 1
    serviceAccount:
      identifier: kometa
    initContainers:
      # Serialize kometa runs across ALL jobs (scheduled + webhook-triggered)
      # as a FIFO queue: wait until every OLDER kometa job has reached a
      # terminal condition (Complete/Failed), then proceed. Only-older
      # ordering means queued waiters never block each other (counting any
      # active job deadlocks as soon as two jobs queue up, since a pod
      # waiting in init is itself "active"), and condition-based checking is
      # immune to .status.active flapping to 0 between pod retries.
      wait-for-turn:
        image:
          repository: docker.io/alpine/k8s
          tag: 1.36.2
        env:
          JOB_NAME:
            valueFrom:
              fieldRef:
                fieldPath: metadata.labels['job-name']
        command:
          - sh
          - -c
          - |
            while true; do
              blockers=$(kubectl get jobs -n media -o json | jq -r --arg self "$JOB_NAME" '
                ([.items[] | select(.metadata.name == $self)] | first) as $me
                | [.items[]
                   | select(.metadata.name != $self)
                   | select(.metadata.name | startswith("kometa"))
                   | select(([.status.conditions[]? | select((.type == "Complete" or .type == "Failed") and .status == "True")] | length) == 0)
                   | select(.metadata.creationTimestamp < $me.metadata.creationTimestamp
                            or (.metadata.creationTimestamp == $me.metadata.creationTimestamp and .metadata.name < $me.metadata.name))]
                | length')
              if [ "$blockers" = "0" ]; then
                echo "no older kometa jobs pending - proceeding"
                exit 0
              fi
              echo "$blockers older kometa job(s) pending - waiting 30s"
              sleep 30
            done
    containers:
      app:
        image:
          repository: docker.io/kometateam/kometa
          tag: v2.4.8@sha256:c58f6d4af511613f218b6dafbfc84078af4e5a6089790c1fdba58fd7c5dad70a
        # Run once and exit (scheduling is handled by the CronJob)
        args:
          - --run
        env:
          TZ: Europe/Helsinki
          # Config is mounted from a ConfigMap — don't let Kometa write it back
          KOMETA_READ_ONLY_CONFIG: "true"
        envFrom:
          - secretRef:
              name: kometa-secret
        probes:
          liveness:
            enabled: false
          readiness:
            enabled: false
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
        resources:
          requests:
            cpu: 10m
            memory: 512Mi
          limits:
            # First full-library run (episode overlays + caching) is memory
            # hungry - repeatedly OOMKilled at 2Gi
            memory: 6Gi
defaultPodOptions:
  securityContext:
    runAsNonRoot: true
    runAsUser: 568
    runAsGroup: 568
    fsGroup: 568
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile: {type: RuntimeDefault}
  dnsConfig:
    options:
      - name: ndots
        value: "1"
      - name: use-vc
      - name: single-request-reopen
persistence:
  config:
    type: persistentVolumeClaim
    existingClaim: kometa
    globalMounts:
      - path: /config
  # Posterizarr's generated assets (shared NFS) — used as overlay base via
  # per-library asset_directory + prioritize_assets in config.yaml
  assets:
    type: nfs
    server: 192.168.0.221
    path: /mnt/Nakkiallas/Public/posterizarr
    globalMounts:
      - path: /assets
        readOnly: true
  config-file:
    type: configMap
    name: kometa-config
    globalMounts:
      - path: /config/config.yml
        subPath: config.yml
        readOnly: true
  tmp:
    type: emptyDir
    globalMounts:
      - path: /tmp
serviceAccount:
  kometa: {}
