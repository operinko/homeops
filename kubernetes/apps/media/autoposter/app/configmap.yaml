---
# Overlay PNGs and font copied byte-for-byte from the production Posterizarr
# pod (/config/Overlayfiles) so autoposter renders identical artwork.
# Embedded as binaryData because Flux source-controller excludes *.png from
# Git artifacts, so configMapGenerator file sources can't be used.
apiVersion: v1
kind: ConfigMap
metadata:
  name: autoposter-overlays
  namespace: media
binaryData:  overlay.png: 
  bottom-up-fade.png: 
  bottom-up-fade-background.png: 
  Comfortaa-Medium.ttf: 
