---
# ExternalSecret to create the hietamakidojo-forgejo-pat secret used by the
# GitRepository sources once pointed at Forgejo. Reuses the Bitwarden item that
# also backs the ruoka_deploy Drupal module's forgejo_dispatch_pat field.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hietamakidojo-forgejo-pat
  namespace: hietamakidojo
spec:
  refreshInterval: 1h
  target:
    name: hietamakidojo-forgejo-pat
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        username: ruoka-deploy
        password: "{{ .forgejo_dispatch_pat }}"
  data:
    - secretKey: forgejo_dispatch_pat
      sourceRef:
        storeRef:
          name: bitwarden-fields
          kind: ClusterSecretStore
      remoteRef:
        key: f7f2ed36-37d2-438c-86b9-4e0d99c4b763
        property: forgejo_dispatch_pat
