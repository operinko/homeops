---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: oidc-auth
spec:
  plugin:
    traefik-oidc-auth:
      LogLevel: WARN
      Secret: "${OIDC_ENCRYPTION_SECRET}"
      # The HeaderRegexp clause restores the LAN exemption that was lost when
      # these routes moved from authentik-forward to this plugin. That bypass
      # used to live in an Authentik Expression Policy evaluated during the
      # forwardAuth call; this plugin terminates OIDC in Traefik itself and
      # never asks Authentik for a policy decision, so the exemption silently
      # ceased to exist. This plugin's rule engine implements only Host,
      # PathPrefix, Header and HeaderRegexp — there is no ClientIP matcher — so
      # the client address has to be matched via the header traefik-warp sets.
      #
      # Not spoofable: warp's cleanInboundForwardingHeaders() deletes any
      # inbound X-Real-Ip/X-Forwarded-For/Forwarded before setting X-Real-Ip
      # itself from the socket IP (or, for trusted CDN sources, from
      # CF-Connecting-IP). Requires traefik-warp to run before oidc-auth in the
      # filter chain, which every route carrying oidc-auth does.
      BypassAuthenticationRule: >-
        PathPrefix(`/api`)
        || PathPrefix(`/newznab`)
        || PathPrefix(`/identity`)
        || PathPrefix(`/triggers`)
        || PathPrefix(`/meshagents`)
        || PathPrefix(`/meshsettings`)
        || PathPrefix(`/agent`)
        || PathPrefix(`/control`)
        || PathPrefix(`/meshrelay`)
        || PathPrefix(`/wl`)
        || PathPrefix(`/socket.io`)
        || PathPrefix(`/audiobookshelf/socket.io`)
        || PathPrefix(`/signalr`)
        || HeaderRegexp(`X-Real-Ip`, `^192\.168\.`)
      Provider:
        Url: "https://auth.vaderrp.com/application/o/traefik/"
        ClientId: "${OIDC_CLIENT_ID}"
        ClientSecret: "${OIDC_CLIENT_SECRET}"
      Scopes: ["openid", "profile", "email"]
      CallbackUri: "/oidc/callback"
      Headers:
        - Name: X-Authentik-Username
          Value: "{{ .claims.preferred_username }}"
        - Name: X-Authentik-Email
          Value: "{{ .claims.email }}"
        - Name: X-Authentik-Name
          Value: "{{ .claims.name }}"
        - Name: X-Authentik-Groups
          Value: "{{ .claims.groups }}"
